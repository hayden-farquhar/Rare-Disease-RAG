[project]
name = "rare-disease-rag"
version = "0.1.0"
description = "RAG-powered clinical decision support for rare disease diagnosis"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0",
    "httpx>=0.27.0",
    "lxml>=5.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.5",
    "rich>=13.0",
    "tiktoken>=0.7",
    "beautifulsoup4>=4.12",
    "pronto>=2.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "jsonlines>=4.0",
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
